version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cts_password}
      POSTGRES_DB: ${POSTGRES_DB:-cts_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cts} -d ${POSTGRES_DB:-cts_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cts_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cts_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cts_postgres_data:
  cts_redis_data:
